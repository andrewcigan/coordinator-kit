name: Тесты
on:
  push:
  workflow_dispatch:
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Тесты набора
        run: bash tests/run.sh
      - name: Установка на чистую машину и хуки по командам из настроек
        run: bash tests/ci-check.sh
